<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thuun - Connexion</title>
    <link href="https://db.onlinewebfonts.com/c/46f1b844c25934e9c98dad60d32caf71?family=Nord" rel="stylesheet" type="text/css"/>
    <style>
        /* Page connexion - design iPhone 16 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #d0e2f4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'New Nord Wide', 'Heavy', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            font-weight: 900;
            font-size: 24px;
            line-height: 100%;
            letter-spacing: 0%;
            text-align: center;
        }

        .login-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            max-height: 100vh;
        }

        /* Header minimaliste */
        .login-header {
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .login-header img {
            width: 480px;
            height: auto;
        }

        .login-header h1 {
            margin: 0;
            font-size: 24px;
            color: #0a2463;
            font-weight: 700;
        }

        /* Main content */
        .login-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            z-index: 3;
        }

        /* Decorative background shape */
        .login-bg-shape {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 40%;
            background: #DB7C3B;
            clip-path: polygon(0 30%, 100% 30%, 100% 100%, 0 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* Floating wave */
        .floating-wave {
            position: fixed;
            bottom: 160px;
            left: 0px;
            width: 200%;
            height: 80px;
            z-index: 1;
            pointer-events: none;
            overflow: visible;
        }
        
        .wave-svg {
            width: 200%;
            height: 100%;
            display: block;
        }

        .wave-fill {
            animation: moveWave 8s linear infinite;
        }

        @keyframes moveWave {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-2400px);
            }
        }

        /* Decorative circles */
        .deco-circle {
            position: fixed;
            background: #DB7C3B;
            border-radius: 50%;
            z-index: 0;
            animation: float linear infinite;
            pointer-events: none;
        }

        .deco-circle-1 {
            width: 34px;
            height: 35px;
            bottom: 35%;
            left: 15%;
            animation-duration: 2s;
        }

        .deco-circle-2 {
            width: 15px;
            height: 15px;
            top: 25%;
            left: 50%;
            animation-duration: 2.5s;
            animation-direction: reverse;
        }

        .deco-circle-3 {
            width: 39px;
            height: 41px;
            top: 15%;
            right: 10%;
            animation-duration: 2.2s;
        }

        .deco-circle-4 {
            width: 39px;
            height: 41px;
            bottom: 20%;
            left: 10%;
            animation-duration: 2.7s;
            animation-direction: reverse;
        }

        .deco-circle-5 {
            width: 20px;
            height: 21px;
            top: 5%;
            right: 5%;
            animation-duration: 2.3s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateX(0);
            }
            50% {
                transform: translateX(20px);
            }
        }

        /* Login form container */
        .login-form-container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 320px;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-title {
            font-size: 20px;
            color: #0a2463;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 12px;
            color: #666;
            font-weight: 600;
            margin-bottom: 6px;
            text-align: left;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #DB7C3B;
            box-shadow: 0 0 0 3px rgba(219, 124, 59, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #DB7C3B;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .login-btn:hover {
            background: #E89761;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            margin-top: 15px;
            padding: 10px;
            background: #ffebee;
            color: #c62828;
            border-radius: 8px;
            font-size: 12px;
            display: none;
            font-weight: 600;
        }

        .error-message.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        .success-message {
            margin-top: 15px;
            padding: 10px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 8px;
            font-size: 12px;
            display: none;
            font-weight: 600;
        }

        .success-message.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        /* Footer */
        .login-footer {
            padding: 20px;
            text-align: center;
            border-top: 1px solid #f0f0f0;
            background: white;
            z-index: 3;
        }

        .login-footer p {
            margin: 5px 0;
            font-size: 12px;
            color: #999;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .login-main {
                padding: 15px;
            }

            .login-form-container {
                padding: 25px;
            }

            .form-title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Background elements -->
        <div class="floating-wave wave-1">
            <svg class="wave-svg" viewBox="0 0 3600 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path class="wave-fill" d="M0,40 Q300,10 600,40 T1200,40 L1200,80 L0,80 Z M1200,40 Q1500,10 1800,40 T2400,40 L2400,80 L1200,80 Z M2400,40 Q2700,10 3000,40 T3600,40 L3600,80 L2400,80 Z" fill="#DB7C3B"/>
            </svg>
        </div>
        <div class="floating-wave wave-2">
            <svg class="wave-svg" viewBox="0 0 3600 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path class="wave-fill" d="M0,40 Q300,10 600,40 T1200,40 L1200,80 L0,80 Z M1200,40 Q1500,10 1800,40 T2400,40 L2400,80 L1200,80 Z M2400,40 Q2700,10 3000,40 T3600,40 L3600,80 L2400,80 Z" fill="#E89761"/>
            </svg>
        </div>
        <div class="floating-wave wave-3">
            <svg class="wave-svg" viewBox="0 0 3600 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path class="wave-fill" d="M0,40 Q300,10 600,40 T1200,40 L1200,80 L0,80 Z M1200,40 Q1500,10 1800,40 T2400,40 L2400,80 L1200,80 Z M2400,40 Q2700,10 3000,40 T3600,40 L3600,80 L2400,80 Z" fill="#F0B896"/>
            </svg>
        </div>
        <div class="login-bg-shape"></div>
        <div class="deco-circle deco-circle-1"></div>
        <div class="deco-circle deco-circle-2"></div>
        <div class="deco-circle deco-circle-3"></div>
        <div class="deco-circle deco-circle-4"></div>
        <div class="deco-circle deco-circle-5"></div>

        <!-- Header -->
        <div class="login-header">
            <img src="images/logotuunbanque-03.svg" alt="Thuun Logo" class="logo">
        </div>

        <!-- Main content -->
        <div class="login-main">
            <div class="login-form-container">
                <div class="form-title">Connexion</div>
                
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="votre@email.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="login-btn">Se connecter</button>
                </form>

                <div id="error-message" class="error-message"></div>
                <div id="success-message" class="success-message"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="login-footer">
            <p>&copy; 2026 Tuun. Tous droits réservés.</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const API_URL = 'http://localhost:3000/api';
        const TOKEN_KEY = 'thuun_token';
        const USER_KEY = 'thuun_user';

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error-message');
            const successEl = document.getElementById('success-message');

            // Reset messages
            errorEl.classList.remove('show');
            successEl.classList.remove('show');

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Sauvegarder le token et les données utilisateur
                    localStorage.setItem(TOKEN_KEY, data.token);
                    localStorage.setItem(USER_KEY, JSON.stringify(data.user));

                    // Afficher message de succès
                    successEl.textContent = 'Connexion réussie! Redirection...';
                    successEl.classList.add('show');

                    // Rediriger vers la page account après 1 seconde
                    setTimeout(() => {
                        window.location.href = 'account.html';
                    }, 1000);
                } else {
                    errorEl.textContent = data.message || 'Email ou mot de passe incorrect';
                    errorEl.classList.add('show');
                }
            } catch (error) {
                console.error('Erreur login:', error);
                errorEl.textContent = 'Erreur de connexion au serveur';
                errorEl.classList.add('show');
            }
        }

        // Vérifier si l'utilisateur est déjà connecté
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem(TOKEN_KEY);
            if (token) {
                // L'utilisateur est déjà connecté, le rediriger vers account
                window.location.href = 'account.html';
            }
        });
    </script>
</body>
</html>
