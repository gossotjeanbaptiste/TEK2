---
- name: Démonstration : écrire un secret déchiffré sur la machine redis (DEMO)
  hosts: redis
  gather_facts: false
  vars_files: []
  tasks:
    - name: Vérifier que la variable existe
      fail:
        msg: "La variable 'octopus_password' n'est pas définie. Générez-la avec ansible-vault encrypt_string."
      when: octopus_password is not defined

    - name: Écrire le secret dans /tmp/octoleak.txt (DEMO)
      copy:
        content: "{{ octopus_password }}"
        dest: /tmp/octoleak.txt
        mode: '0600'

    - name: Afficher un message de fin
      debug:
        msg: "/tmp/octoleak.txt créé sur {{ inventory_hostname }} (mode demo)"
