---
# Default variables for the nodejs role

# Node.js version to install
nodejs_version: "18.x"

# NPM should be installed alongside Node.js
nodejs_npm_install: true

# NodeSource GPG key
nodejs_apt_key_url: "https://deb.nodesource.com/gpgkey/nodesource.gpg.key"

# NodeSource repository URL
nodejs_apt_repo_url: "deb https://deb.nodesource.com/node_{{ nodejs_version }} {{ ansible_distribution_release }} main"
