# TYPE  DATABASE        USER            ADDRESS                 METHOD

# 1. Autoriser l'utilisateur local 'postgres' et les connexions locales (indispensable)
local   all             postgres                                peer
local   all             all                                     md5
host    all             all             127.0.0.1/32            md5
host    all             all             ::1/128                 md5

# 2. Autoriser l'utilisateur 'paul' à se connecter depuis les autres machines du projet
# Option A (Sécurisée et recommandée si les VMs sont sur le même sous-réseau, ex: 192.168.1.0/24)
host    paul            paul            192.168.56.0/24          md5

# Option B (Plus permissive, si tu ne connais pas le réseau des VMs ou si elles sont sur un Cloud)
# host    paul            paul            0.0.0.0/0               md5