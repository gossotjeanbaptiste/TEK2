# Advanced Colored Lights Scene
# Multiple colored lights affecting colored objects

# Camera
camera: 0 0 -7 72 800 600

# Ambient light - very subtle
ambient: 0.1 255 255 255

# Red light from the left
directional: -1 0.5 0.5 0.8 255 100 100

# Green light from the front-right
directional: 1 0.3 0.5 0.8 100 255 100

# Cyan light from the back-right
directional: 0.5 -0.5 1 0.6 100 255 255

# Blue light from above
directional: 0 1 0.2 0.5 100 100 255

# Colored toruses - placed at the exact same positions as the original spheres
# Format: torus: x y z grand_rayon petit_rayon r g b a
torus: -4 0 0 0.5 0.18 255 100 100 1.0
torus: -2 0 0 0.5 0.18 100 100 255 1.0
torus: 0  0 0 0.5 0.18 100 255 100 1.0
torus: 2  0 0 0.5 0.18 255 255 100 1.0
torus: 4  0 0 0.5 0.18 255 100 255 1.0

# Ground to show reflected light effects
plane: 0 4 0 0 -1 0 200 200 200 1.0
