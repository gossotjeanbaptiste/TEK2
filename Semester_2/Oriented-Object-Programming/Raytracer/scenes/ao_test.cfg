# Ambient Occlusion Test Scene - AGGRESSIVE VERSION
# Demonstrating strong ambient occlusion effects

# Camera - good view of the scene
camera: 0 0 -15 90 1920 1080

# Ambient light
ambient: 0.3 255 255 255

# Ambient Occlusion - STRONG and AGGRESSIVE
# 32 samples, high intensity, larger detection distance
ambientocclusion: 0.7 200 200 200 32 5.0

# Directional light from the front-left
directional: -0.5 0.5 0 0.8 255 200 100

# Directional light from the right
directional: 1 0 0.3 0.6 100 200 255

# Central sphere - shows strong AO shading
sphere: 0 0 0 2 200 200 200

# Surrounding spheres to create heavy occlusion
sphere: -3.5 0 0 1 180 180 180
sphere: 3.5 0 0 1 180 180 180
sphere: 0 3.5 0 1 180 180 180
sphere: 0 -3.5 0 1 180 180 180

# Spheres in corners - will be VERY dark due to AO
sphere: -3 3 0 0.8 160 160 160
sphere: 3 3 0 0.8 160 160 160
sphere: -3 -3 0 0.8 160 160 160
sphere: 3 -3 0 0.8 160 160 160
