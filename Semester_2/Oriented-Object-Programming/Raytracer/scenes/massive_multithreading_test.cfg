# ========================================
# PLANES (Background and sides - positioned to not block objects)
# ========================================

# Main ground plane
plane: 0 -7 -5 0 1 0 180 180 180

# Back wall (far away)
plane: 0 0 -25 0 0 1 150 150 180

# ========================================
# TRANSFORMED OBJECTS (Using rotation/scaling)
# ========================================

# Rotated objects for visual variety
transform: rotate 45 45 45
sphere: -3 3.5 -2 0.25 255 200 100
sphere: 3 3.5 -2 0.25 100 200 255

# Scaled objects
transform: scale 1.5 1.5 1.5
cone: 0 3 -2 0.4 0.15 0 1 0 150 255 150

# Complex transformation
transform: rotate 30 60 15
limited_cone: -3 -1 -2 0.6 0.2 0 1 0 255 150 150
