# MASSIVE Multithreading Test Scene
# Uses ALL available primitives, lights, and transformations
# Designed to stress-test the multithreading system

# Camera: position + fov + width height (high resolution for parallelization testing)
camera: 0 -0.5 -12 85.0 2560 1440

# ========================================
# LIGHTING SETUP (Multiple colored lights)
# ========================================

# Strong ambient light for base illumination
ambient: 0.3 255 255 255

# Ambient Occlusion for visual complexity (reduced for visibility)
ambientocclusion: 0.25 200 200 200 16 2.5

# 8 Directional lights from different angles and colors
directional: -1 -1 -1 0.8 255 200 150
directional: 1 -1 -1 0.75 150 200 255
directional: -1 1 -1 0.7 200 255 150
directional: 1 1 -1 0.65 255 150 200
directional: 0 -1 1 0.6 150 255 200
directional: -1 0 1 0.55 255 255 100
directional: 1 0 1 0.5 200 100 255
directional: 0 1 1 0.45 100 255 255

# ========================================
# ROW 1: SPHERES (Various sizes and colors)
# ========================================

# Left cluster - Red tones
sphere: -5 2 -4 0.35 255 50 50
sphere: -4.2 2 -4 0.3 255 100 100
sphere: -3.4 2 -4 0.25 255 150 150

# Center-left cluster - Green tones
sphere: -2 2 -4 0.35 50 255 50
sphere: -1.2 2 -4 0.3 100 255 100
sphere: -0.4 2 -4 0.25 150 255 150

# Center-right cluster - Blue tones
sphere: 0.8 2 -4 0.35 50 50 255
sphere: 1.6 2 -4 0.3 100 100 255
sphere: 2.4 2 -4 0.25 150 150 255

# Right cluster - Yellow/Magenta tones
sphere: 3.6 2 -4 0.35 255 255 50
sphere: 4.4 2 -4 0.3 255 100 255
sphere: 5.2 2 -4 0.25 100 255 255

# ========================================
# ROW 2: CYLINDERS (Different sizes/rotations)
# ========================================

# Left cylinders
cylinder: -5 0.5 -4 0.15 0.6 0 1 0 200 100 50
cylinder: -4.2 0.5 -4 0.12 0.5 1 0 0 100 200 50
cylinder: -3.4 0.5 -4 0.18 0.7 0 1 0 50 100 200

# Center-left cylinders
cylinder: -2 0.5 -4 0.15 0.6 1 0 0 200 50 100
cylinder: -1.2 0.5 -4 0.14 0.55 0 1 0 100 50 200
cylinder: -0.4 0.5 -4 0.16 0.65 0 1 0 50 200 100

# Center-right cylinders
cylinder: 0.8 0.5 -4 0.15 0.6 0 1 0 150 100 200
cylinder: 1.6 0.5 -4 0.13 0.52 1 0 0 100 150 200
cylinder: 2.4 0.5 -4 0.17 0.68 0 1 0 200 150 100

# Right cylinders
cylinder: 3.6 0.5 -4 0.15 0.6 0 1 0 200 200 100
cylinder: 4.4 0.5 -4 0.14 0.54 1 0 0 150 200 150
cylinder: 5.2 0.5 -4 0.16 0.66 0 1 0 100 200 200

# ========================================
# ROW 3: CONES (Different heights)
