cone: -4.2 -0.5 -4 0.5 0.2 0 1 0 100 255 100
cone: -3.4 -0.5 -4 0.7 0.3 0 1 0 100 100 255

# Center-left cones
cone: -2 -0.5 -4 0.55 0.22 0 1 0 255 255 100
cone: -1.2 -0.5 -4 0.6 0.25 0 1 0 100 255 255
cone: -0.4 -0.5 -4 0.5 0.2 0 1 0 255 100 255

# Center-right cones
