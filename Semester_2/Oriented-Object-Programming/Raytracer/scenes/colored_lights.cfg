# Colored Lights - Working Version
# Camera looking at the sphere

camera: 0 0 -7.5 60 1920 1080

# Stronger ambient lighting so sphere is visible
ambient: 0.5 255 255 255

# Red light coming FROM the RIGHT, going LEFT (illuminates left side of sphere)
directional: 1 0 0 0.7 255 0 0

# Green light coming FROM the LEFT, going RIGHT (illuminates right side of sphere)
directional: -1 0 0 0.7 0 255 0

# Blue light coming FROM BELOW, going UP (illuminates top of sphere)
directional: 0 -1 0 0.7 0 0 255

# White sphere at origin
sphere: 0 0 0 1 255 255 255
